name: re_editor
description: A vendored fork of re_editor 0.10.0 used by the Daylight apps - adds ligature control and column (block) selection.
version: 0.10.0+1
repository: https://github.com/jejezz/daylight-editor-flutter
publish_to: none

environment:
  sdk: ">=2.17.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  re_highlight: ^0.0.3
  isolate_manager: ^4.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  path: ^1.8.2